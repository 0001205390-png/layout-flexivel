<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Riot-games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"rel="stylesheet">
</head>
<body>
    <div class="principal">
        <div class="caixa">
            <img class="logo" src="assets/riot-logo.png" alt="logo">
            <span class="span">SIGN IN</span>
        </div>
          <main class="login">
            <label for="nome">Digite seu nome</label>
            <input type="text" id="nome" name="nome" placeholder="war D3N00">

            <label for="senha">Digite sua senha</label>
            <input type="text" id="senha" name="senha" placeholder="PASSEWORD">

            <div class="resgate">
                <span>Remember Me</span>
                <span >Forgot Passeword</span>
            </div>

            <button class="b1">SIGN IN</button>
            <p class="a">Don't have an account?<span class="si">Sign Up</span></p>
            <span class="a">Or Sign In With</span>

            <div class="opcoes">
                <button class="b2">
                    <img class="G" src="assets/images.jpg" alt="icone Google" >
                </button>
                <button class="b3">
                    <img class="X" src="assets/xbox-removebg-preview.png" alt="logo Xbox">
                </button>
            </div>

        </main>
    </div>
</body>
</html>
